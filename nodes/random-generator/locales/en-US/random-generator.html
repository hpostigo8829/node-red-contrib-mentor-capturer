<script type="text/html" data-help-name="random-generator">

<p>Generates simulated numeric values at a configurable interval, using different variation modes
(random, smooth, random walk, sine wave, step). Useful for simulating sensors or testing flows
without real hardware.</p>

<h3>Configuration</h3>
<dl class="message-properties">
    <dt>Min value / Max value</dt>
    <dd>Range of the generated values.</dd>
    <dt>Mode</dt>
    <dd>How the value varies:
        <ul>
            <li><b>Random</b>: uniform random value within the range on each interval.</li>
            <li><b>Smooth</b>: gradually moves toward a new random target (no sudden jumps).</li>
            <li><b>Random Walk</b>: small cumulative random steps around the current value.</li>
            <li><b>Sine Wave</b>: oscillates following a sine curve between min and max, with a configurable speed.</li>
            <li><b>Step</b>: cycles through a fixed set of intermediate values (random or sequential).</li>
        </ul>
    </dd>
    <dt>Number Type</dt>
    <dd><code>Decimal</code> (with configurable decimal count) or <code>Integer</code>.</dd>
    <dt>Step Count / Step Mode</dt>
    <dd>Only with Step mode — how many intermediate values, and whether they're cycled in order or at random.</dd>
    <dt>Sine Speed</dt>
    <dd>Only with Sine Wave mode — how fast it oscillates.</dd>
    <dt>Output Type</dt>
    <dd><code>Number</code> or <code>String</code>.</dd>
    <dt>Interval</dt>
    <dd>How often a new value is generated (seconds or minutes).</dd>
</dl>

<h3>Input</h3>
<p>None — the node has no inputs; it generates values on its own based on the configured interval.</p>

<h3>Output</h3>
<p><code>msg.payload</code> with the generated value, according to the configured Number Type and Output Type.</p>

</script>
