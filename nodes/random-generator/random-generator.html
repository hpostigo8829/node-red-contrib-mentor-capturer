<script type="text/javascript">

RED.nodes.registerType('random-generator',{

 category:'mentor-capturer',
 color:'#07A52F',

 defaults:{
  name:{value:""},
  min:{value:0},
  max:{value:100},
  interval:{value:1},
  unit:{value:"seconds"},
  mode:{value:"random"},
  numberType:{value:"decimal"},
  decimals:{value:2},
  steps:{value:5},
  stepMode:{value:"random"},
  speed:{value:0.2},
  outputType:{value:"number"}
 },

 inputs:0,
 outputs:1,
 icon:"random.png",
 paletteLabel:function(){
  return this._("random-generator.palette")
 },

 label:function(){
  return this.name || this._("random-generator.palette")
 },

 oneditprepare:function(){

  function toggleDecimals(){
   $("#row-decimals").toggle($("#node-input-numberType").val()==="decimal")
  }

  function toggleStep(){
   let isStep=$("#node-input-mode").val()==="step"
   $("#row-steps").toggle(isStep)
   $("#row-stepMode").toggle(isStep)
  }

  function toggleSpeed(){
   $("#row-speed").toggle($("#node-input-mode").val()==="sine")
  }

  $("#node-input-numberType").change(toggleDecimals)
  $("#node-input-mode").change(function(){
   toggleStep()
   toggleSpeed()
  })

  toggleDecimals()
  toggleStep()
  toggleSpeed()

 }

})

</script>

<script type="text/x-red" data-template-name="random-generator">

<div class="form-row">
<label for="node-input-name" data-i18n="node-red:common.label.name"></label>
<input type="text" id="node-input-name">
</div>

<div class="form-row">
<label data-i18n="random-generator.label.min"></label>
<input type="number" id="node-input-min">
</div>

<div class="form-row">
<label data-i18n="random-generator.label.max"></label>
<input type="number" id="node-input-max">
</div>

<div class="form-row">
<label data-i18n="random-generator.label.mode"></label>
<select id="node-input-mode">
<option value="random" data-i18n="random-generator.label.random"></option>
<option value="smooth" data-i18n="random-generator.label.smooth"></option>
<option value="walk" data-i18n="random-generator.label.walk"></option>
<option value="sine" data-i18n="random-generator.label.sine"></option>
<option value="step" data-i18n="random-generator.label.step"></option>
</select>
</div>

<div class="form-row">
<label data-i18n="random-generator.label.numberType"></label>
<select id="node-input-numberType">
<option value="decimal" data-i18n="random-generator.label.decimal"></option>
<option value="integer" data-i18n="random-generator.label.integer"></option>
</select>
</div>

<div class="form-row" id="row-decimals">
<label data-i18n="random-generator.label.decimals"></label>
<select id="node-input-decimals">
<option value="1">1</option>
<option value="2">2</option>
</select>
</div>

<div class="form-row" id="row-steps">
<label data-i18n="random-generator.label.stepCount"></label>
<input type="number" id="node-input-steps">
</div>

<div class="form-row" id="row-stepMode">
<label data-i18n="random-generator.label.stepMode"></label>
<select id="node-input-stepMode">
<option value="random" data-i18n="random-generator.label.random"></option>
<option value="sequential" data-i18n="random-generator.label.sequential"></option>
</select>
</div>

<div class="form-row" id="row-speed">
<label data-i18n="random-generator.label.sineSpeed"></label>
<input type="number" id="node-input-speed" step="0.05">
</div>

<div class="form-row">
<label data-i18n="random-generator.label.outputType"></label>
<select id="node-input-outputType">
<option value="number" data-i18n="random-generator.label.number"></option>
<option value="string" data-i18n="random-generator.label.string"></option>
</select>
</div>

<div class="form-row">
<label data-i18n="random-generator.label.interval"></label>
<input type="number" id="node-input-interval" style="width:80px;">
<select id="node-input-unit" style="width:120px;">
<option value="seconds" data-i18n="random-generator.label.seconds"></option>
<option value="minutes" data-i18n="random-generator.label.minutes"></option>
</select>
</div>

</script>
