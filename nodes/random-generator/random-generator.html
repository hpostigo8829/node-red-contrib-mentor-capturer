<script type="text/javascript">

RED.nodes.registerType('random-generator',{

 category:'mentor-capturer',
 color:'#07A52F',

 defaults:{
  name:{value:""},
  min:{value:0},
  max:{value:100},
  interval:{value:1},
  unit:{value:"seconds"},
  mode:{value:"random"},
  numberType:{value:"decimal"},
  decimals:{value:2},
  steps:{value:5},
  stepMode:{value:"random"},
  speed:{value:0.2},
  outputType:{value:"number"}
 },

 inputs:0,
 outputs:1,
 icon:"random.png",
 paletteLabel:"Random Generator",

 label:function(){
  return this.name || "Random Generator"
 },

 oneditprepare:function(){

  function toggleDecimals(){
   $("#row-decimals").toggle($("#node-input-numberType").val()==="decimal")
  }

  function toggleStep(){
   let isStep=$("#node-input-mode").val()==="step"
   $("#row-steps").toggle(isStep)
   $("#row-stepMode").toggle(isStep)
  }

  function toggleSpeed(){
   $("#row-speed").toggle($("#node-input-mode").val()==="sine")
  }

  $("#node-input-numberType").change(toggleDecimals)
  $("#node-input-mode").change(function(){
   toggleStep()
   toggleSpeed()
  })

  toggleDecimals()
  toggleStep()
  toggleSpeed()

 }

})

</script>

<script type="text/x-red" data-template-name="random-generator">

<div class="form-row">
<label>Name</label>
<input type="text" id="node-input-name">
</div>

<div class="form-row">
<label>Min value</label>
<input type="number" id="node-input-min">
</div>

<div class="form-row">
<label>Max value</label>
<input type="number" id="node-input-max">
</div>

<div class="form-row">
<label>Mode</label>
<select id="node-input-mode">
<option value="random">Random</option>
<option value="smooth">Smooth</option>
<option value="walk">Random Walk</option>
<option value="sine">Sine Wave</option>
<option value="step">Step</option>
</select>
</div>

<div class="form-row">
<label>Number Type</label>
<select id="node-input-numberType">
<option value="decimal">Decimal</option>
<option value="integer">Integer</option>
</select>
</div>

<div class="form-row" id="row-decimals">
<label>Decimals</label>
<select id="node-input-decimals">
<option value="1">1</option>
<option value="2">2</option>
</select>
</div>

<div class="form-row" id="row-steps">
<label>Step Count</label>
<input type="number" id="node-input-steps">
</div>

<div class="form-row" id="row-stepMode">
<label>Step Mode</label>
<select id="node-input-stepMode">
<option value="random">Random</option>
<option value="sequential">Sequential</option>
</select>
</div>

<div class="form-row" id="row-speed">
<label>Sine Speed</label>
<input type="number" id="node-input-speed" step="0.05">
</div>

<div class="form-row">
<label>Output Type</label>
<select id="node-input-outputType">
<option value="number">Number</option>
<option value="string">String</option>
</select>
</div>

<div class="form-row">
<label>Interval</label>
<input type="number" id="node-input-interval" style="width:80px;">
<select id="node-input-unit" style="width:120px;">
<option value="seconds">Seconds</option>
<option value="minutes">Minutes</option>
</select>
</div>

</script>

<script type="text/x-red" data-help-name="random-generator">

<p>Generates simulated numeric values at a configurable interval, using different variation modes
(random, smooth, random walk, sine wave, step). Useful for simulating sensors or testing flows
without real hardware.</p>

<h3>Configuration</h3>
<dl class="message-properties">
    <dt>Min value / Max value</dt>
    <dd>Range of the generated values.</dd>
    <dt>Mode</dt>
    <dd>How the value varies:
        <ul>
            <li><b>Random</b>: uniform random value within the range on each interval.</li>
            <li><b>Smooth</b>: gradually moves toward a new random target (no sudden jumps).</li>
            <li><b>Random Walk</b>: small cumulative random steps around the current value.</li>
            <li><b>Sine Wave</b>: oscillates following a sine curve between min and max, with a configurable speed.</li>
            <li><b>Step</b>: cycles through a fixed set of intermediate values (random or sequential).</li>
        </ul>
    </dd>
    <dt>Number Type</dt>
    <dd><code>Decimal</code> (with configurable decimal count) or <code>Integer</code>.</dd>
    <dt>Step Count / Step Mode</dt>
    <dd>Only with Step mode — how many intermediate values, and whether they're cycled in order or at random.</dd>
    <dt>Sine Speed</dt>
    <dd>Only with Sine Wave mode — how fast it oscillates.</dd>
    <dt>Output Type</dt>
    <dd><code>Number</code> or <code>String</code>.</dd>
    <dt>Interval</dt>
    <dd>How often a new value is generated (seconds or minutes).</dd>
</dl>

<h3>Input</h3>
<p>None — the node has no inputs; it generates values on its own based on the configured interval.</p>

<h3>Output</h3>
<p><code>msg.payload</code> with the generated value, according to the configured Number Type and Output Type.</p>

</script>
