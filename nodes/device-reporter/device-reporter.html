
<style>

.device-report-config{
 display:flex;
 gap:6px;
 align-items:center;
}

</style>


<script type="text/javascript">

RED.nodes.registerType('device-reporter',{

 category:'mentor-capturer',
 color:'#E1704A',

 defaults:{
  name:{value:""},
  interval:{value:60,required:true,validate:RED.validators.number()},
  unit:{value:"seconds"}
 },

 inputs:1,
 outputs:1,
 icon:"file.png",
 paletteLabel:"Device Reporter",

 label:function(){
  return this.name || "Device Reporter"
 }

})

</script>


<script type="text/x-red" data-template-name="device-reporter">

<div class="form-row">
<label>Name</label>
<input type="text" id="node-input-name">
</div>

<div class="form-row">
<label>Report Interval</label>

<div class="device-report-config">

<input type="number"
 id="node-input-interval"
 style="width:90px;"
 min="1">

<select id="node-input-unit" style="width:130px;">

<option value="seconds">Seconds</option>
<option value="minutes">Minutes</option>
<option value="hours">Hours</option>

</select>

</div>

</div>

</script>

<script type="text/x-red" data-help-name="device-reporter">

<p>Aggregates readings per device and periodically emits a summary report for each of its variables and thresholds.</p>

<h3>Configuration</h3>
<dl class="message-properties">
    <dt>Report Interval</dt>
    <dd>How often a report is generated and sent for each device that has received data (seconds, minutes, or hours).</dd>
</dl>

<h3>Input</h3>
<p>Expects the variable message emitted by output 1 of the <code>modbus-variable</code> node, which includes its configured <code>thresholds[]</code>.</p>

<h3>Output</h3>
<p>On each interval, emits one report per device with per-variable summary statistics
(sum, count, average, min, max, standard deviation) and, for each threshold, the time
ranges during which its condition stayed true along with statistics for that range.</p>

</script>
