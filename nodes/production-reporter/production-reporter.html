<style>

.production-report-config{
 display:flex;
 gap:6px;
 align-items:center;
}

</style>

<script type="text/javascript">

RED.nodes.registerType('production-reporter',{

 category:'mentor-capturer',
 color:'#23A5F6',

 defaults:{
  name:{value:""},
  interval:{value:60,required:true,validate:RED.validators.number()},
  unit:{value:"seconds"}
 },

 inputs:1,
 outputs:1,
 icon:"file.png",
 paletteLabel:function(){
  return this._("production-reporter.palette")
 },

 label:function(){
  return this.name || this._("production-reporter.palette")
 }

})

</script>

<script type="text/x-red" data-template-name="production-reporter">

<div class="form-row">
 <label for="node-input-name" data-i18n="node-red:common.label.name"></label>
 <input type="text" id="node-input-name">
</div>

<div class="form-row">
 <label data-i18n="production-reporter.label.interval"></label>

 <div class="production-report-config">

  <input type="number"
   id="node-input-interval"
   style="width:90px;"
   min="1">

  <select id="node-input-unit" style="width:130px;">
   <option value="seconds" data-i18n="production-reporter.label.seconds"></option>
   <option value="minutes" data-i18n="production-reporter.label.minutes"></option>
   <option value="hours" data-i18n="production-reporter.label.hours"></option>
  </select>

 </div>

</div>

</script>
