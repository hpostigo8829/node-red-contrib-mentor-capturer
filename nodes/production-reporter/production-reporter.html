<style>

.production-report-config{
 display:flex;
 gap:6px;
 align-items:center;
}

</style>

<script type="text/javascript">

RED.nodes.registerType('production-reporter',{

 category:'mentor-capturer',
 color:'#23A5F6',

 defaults:{
  name:{value:""},
  interval:{value:60,required:true,validate:RED.validators.number()},
  unit:{value:"seconds"}
 },

 inputs:1,
 outputs:1,
 icon:"file.png",
 paletteLabel:"Production Reporter",

 label:function(){
  return this.name || "Production Reporter"
 }

})

</script>

<script type="text/x-red" data-template-name="production-reporter">

<div class="form-row">
 <label>Name</label>
 <input type="text" id="node-input-name">
</div>

<div class="form-row">
 <label>Report Interval</label>

 <div class="production-report-config">

  <input type="number"
   id="node-input-interval"
   style="width:90px;"
   min="1">

  <select id="node-input-unit" style="width:130px;">
   <option value="seconds">Seconds</option>
   <option value="minutes">Minutes</option>
   <option value="hours">Hours</option>
  </select>

 </div>

</div>

</script>

<script type="text/x-red" data-help-name="production-reporter">

<p>
Generates production reports by aggregating sensor data and alarm events over a configurable time interval.
</p>

<h3>Input</h3>
<ul>
<li><b>Sensors:</b> Messages with <code>msg.variables</code></li>
<li><b>Alarms:</b> Messages with <code>msg.payload.alarm_name</code></li>
</ul>

<h3>Output</h3>
<p>
Emits a consolidated report with:
</p>
<ul>
<li><code>device_uuid</code></li>
<li><code>device_name</code></li>
<li><code>variables</code> (accumulated count)</li>
<li><code>alarms</code> (activation ranges)</li>
<li><code>start_range</code> / <code>end_range</code></li>
</ul>

<h3>Configuration</h3>
<p>
Sets how often the report is generated:
seconds, minutes, or hours.
</p>

</script>
