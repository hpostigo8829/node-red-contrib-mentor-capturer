<script type="text/javascript" src="resources/node-red-contrib-mentor-capturer/naturaleza-variable.js"></script>
<script type="text/javascript" src="resources/node-red-contrib-mentor-capturer/fila-variable.js"></script>

<script type="text/javascript">

var reglas=MentorNaturalezaVariable

var functions=[
 {v:"FC1",t:"FC1 Read Coils"},
 {v:"FC2",t:"FC2 Read Discrete Inputs"},
 {v:"FC3",t:"FC3 Read Holding Registers"},
 {v:"FC4",t:"FC4 Read Input Registers"}
]

var datatypes=[
 {v:"bool",t:"Boolean"},
 {v:"int16",t:"Int16"},
 {v:"uint16",t:"UInt16 / Word"},
 {v:"int32",t:"Int32"},
 {v:"uint32",t:"UInt32 / DWord"},
 {v:"float32",t:"Float32"},
 {v:"int64",t:"Int64"},
 {v:"uint64",t:"UInt64"},
 {v:"float64",t:"Float64 / Double"}
]

var byteorders=[
 {v:"BE",k:"bigEndian"},
 {v:"LE",k:"littleEndian"}
]

var wordorders=[
 {v:"normal",k:"normal"},
 {v:"swap",k:"swapWords"}
]

var scales=[
 {v:"0.001",t:"0.001"},
 {v:"0.01",t:"0.01"},
 {v:"0.1",t:"0.1"},
 {v:"1",t:"1"},
 {v:"10",t:"10"},
 {v:"100",t:"100"},
 {v:"1000",t:"1000"}
]

// RN4 (spec 007): items {device_uuid, variable_uuid, name} de este nodo (con
// los valores del formulario en pantalla, no los guardados) más los de todos
// los demás modbus-variable/module-production del espacio de trabajo que
// declaren el mismo device_uuid. E6: dos nodos del mismo equipo comparten
// device_uuid a propósito, así que la unicidad se comprueba sumando los dos.
function itemsDeIdentidad(nodoEnEdicion){

 let deviceUuid=reglas.normalizarUuid(nodoEnEdicion.device_uuid||"")
 if(!deviceUuid) return []

 let items=(nodoEnEdicion.sequences||[]).map(function(s){
  return {device_uuid:deviceUuid,variable_uuid:s.variable_uuid,name:s.name}
 })

 RED.nodes.eachNode(function(n){

  if(n.id===nodoEnEdicion.id) return

  if(n.type==="modbus-variable" && n.device_uuid===deviceUuid){
   (n.sequences||[]).forEach(function(s){
    items.push({device_uuid:deviceUuid,variable_uuid:s.variable_uuid,name:s.name})
   })
  }

  if(n.type==="module-production" && n.device_uuid===deviceUuid){
   ["uuid_sc1","uuid_sc2","uuid_sp"].forEach(function(k){
    if(n[k]) items.push({device_uuid:deviceUuid,variable_uuid:n[k],name:k})
   })
  }

 })

 return items

}

// E5 (spec 007): otro nodo del espacio de trabajo con el mismo device_uuid y
// otro device_name. Solo avisa; no invalida (E6).
function nombresDeDispositivoCompartido(nodoEnEdicion){

 let deviceUuid=reglas.normalizarUuid(nodoEnEdicion.device_uuid||"")
 if(!deviceUuid) return []

 let items=[{device_uuid:deviceUuid,device_name:nodoEnEdicion.device_name||""}]

 RED.nodes.eachNode(function(n){

  if(n.id===nodoEnEdicion.id) return
  if((n.type==="modbus-variable" || n.type==="module-production") && n.device_uuid===deviceUuid){
   items.push({device_uuid:deviceUuid,device_name:n.device_name||""})
  }

 })

 return reglas.dispositivosConNombresDistintos(items)

}

function refreshRow(row){

let fc=row.find(".node-input-function").val()
let datatypeField=row.find(".node-input-datatype")
let datatype=datatypeField.val()

let byteRow=row.find(".row-byte")
let wordRow=row.find(".row-word")
let scaleRow=row.find(".row-scale")

byteRow.hide()
wordRow.hide()
scaleRow.hide()

datatypeField.prop("disabled",false)
datatypeField.find("option").prop("disabled",false)

if(fc==="FC1"||fc==="FC2"){

 datatypeField.val("bool")
 datatypeField.find("option").not('[value="bool"]').prop("disabled",true)
 datatypeField.prop("disabled",true)

 return
}

datatypeField.find('option[value="bool"]').prop("disabled",true)

if(datatype==="bool"){

 datatypeField.val("uint16")
 datatype="uint16"

}

if(datatype==="int16"||datatype==="uint16"){

 scaleRow.show()
 return

}

byteRow.show()
wordRow.show()
scaleRow.show()

}


RED.nodes.registerType('modbus-variable',{

category:'mentor-capturer',
color:'#E9967A',

defaults:{
 name:{value:""},
 device_uuid:{
  value:"",
  required:true,
  validate:function(v){
   if(typeof MentorNaturalezaVariable==="undefined") return true
   return MentorNaturalezaVariable.esUuidV4(MentorNaturalezaVariable.normalizarUuid(v))
  }
 },
 device_name:{value:"",required:true},
 unitid:{value:"1"},
 period_ms:{
  value:1000,
  validate:function(v){
   let n=Number(v)
   return Number.isFinite(n) && n>0
  }
 },
 // Ciclos fallidos seguidos para abrir una alarma de comunicación (spec 010, D8).
 // Un ciclo fallido es uno en el que todas las lecturas fallaron. 1 = al primero.
 failed_cycles:{
  value:3,
  validate:function(v){
   if(v==="" || v===undefined || v===null) return true
   let n=Number(v)
   return Number.isInteger(n) && n>=1
  }
 },
 sequences:{
  value:[],
  validate:function(secuencias){

   if(typeof MentorNaturalezaVariable==="undefined") return true

   // Spec 009: toda variable declara su uso. Una guardada por versiones
   // anteriores con nature/role se acepta (el uso se deduce); una sin ninguno de
   // los dos, o con un umbral mal escrito, deja el nodo en rojo.
   let formatoOk=(secuencias||[]).every(function(s){
    return !!s.name
     && MentorNaturalezaVariable.validarVariable(s).length===0
     && MentorNaturalezaVariable.avisosDeConfiguracion(s).length===0
     && MentorNaturalezaVariable.esUuidV4(s.variable_uuid)
   })

   if(!formatoOk) return false

   // RN4: unicidad por device_uuid, sumando este nodo con los demás
   // modbus-variable / module-production del espacio de trabajo que
   // comparten el mismo device_uuid (E6).
   return MentorNaturalezaVariable.duplicadosPorDispositivo(itemsDeIdentidad(this)).length===0

  }
 },
 server:{
  type:'modbus-client',
  required:true
 }
},

inputs:1,
outputs:3,
icon:'modbus.png',
paletteLabel:function(){
 return this._("modbus-variable.palette")
},

label:function(){
 if(this.name) return this.name
 return this._("modbus-variable.palette")
},

oneditprepare:function(){

let editado=this

// Los textos del formulario común y de las filas salen del catálogo de este nodo
// (spec 010, D15), en el idioma del editor.
let t=function(clave,variables){ return editado._("modbus-variable."+clave,variables) }
let tFila=function(clave,variables){ return editado._("modbus-variable.fila."+clave,variables) }

$("#btn-generar-device-uuid").on("click",function(e){
 e.preventDefault()
 $("#node-input-device_uuid").val(reglas.nuevoUuidV4())
})

$("#btn-generar-faltantes").on("click",function(e){
 e.preventDefault()
 $("#node-input-sequences-container").editableList('items').each(function(){
  let uuidField=$(this).find(".mfv-uuid")
  if(!uuidField.val()) uuidField.val(reglas.nuevoUuidV4())
 })
})

$("#node-input-sequences-container").editableList({

addItem:function(row,index,data){

// Lo guardado por versiones anteriores se adapta aquí: el uso se deduce de
// nature/role y "type" y "priority" desaparecen.
let sequence=reglas.cargarVariable(data||{})

row.css({
 overflow:'hidden',
 whiteSpace:'nowrap'
})

let fila=MentorFilaVariable.crear(row,sequence,{

 conModo:true,
 t:tFila,

 // Los campos propios de Modbus van entre el uso y los umbrales.
 antesDeUmbrales:function(contenedor){

  let r2=$('<div/>',{class:"form-row"}).appendTo(contenedor)
  let r3=$('<div/>',{class:"form-row"}).appendTo(contenedor)
  let r4=$('<div/>',{class:"form-row row-byte"}).appendTo(contenedor)
  let r5=$('<div/>',{class:"form-row row-word"}).appendTo(contenedor)
  let r6=$('<div/>',{class:"form-row row-scale"}).appendTo(contenedor)
  let r7=$('<div/>',{class:"form-row"}).appendTo(contenedor)

  $('<label/>').text(t("row.function")).appendTo(r2)
  let fcField=$('<select/>',{class:"node-input-function"}).appendTo(r2)

  functions.forEach(function(f){
   fcField.append($("<option>").val(f.v).text(f.t))
  })

  $('<label/>').text(t("row.datatype")).appendTo(r3)
  let datatypeField=$('<select/>',{class:"node-input-datatype"}).appendTo(r3)

  datatypes.forEach(function(d){
   datatypeField.append($("<option>").val(d.v).text(d.t))
  })

  $('<label/>').text(t("row.byteorder")).appendTo(r4)
  let byteField=$('<select/>',{class:"node-input-byteorder"}).appendTo(r4)

  byteorders.forEach(function(b){
   byteField.append($("<option>").val(b.v).text(t("row."+b.k)))
  })

  $('<label/>').text(t("row.wordorder")).appendTo(r5)
  let wordField=$('<select/>',{class:"node-input-wordorder"}).appendTo(r5)

  wordorders.forEach(function(w){
   wordField.append($("<option>").val(w.v).text(t("row."+w.k)))
  })

  $('<label/>').text(t("row.scale")).appendTo(r6)
  let scaleField=$('<select/>',{class:"node-input-scale"}).appendTo(r6)

  scales.forEach(function(s){
   scaleField.append($("<option>").val(s.v).text(s.t))
  })

  $('<label/>').text(t("row.address")).appendTo(r7)
  let addressField=$('<input/>',{class:"node-input-address"}).appendTo(r7)

  datatypeField.val(sequence.datatype||"uint16")
  byteField.val(sequence.byteorder||"BE")
  wordField.val(sequence.wordorder||"normal")
  scaleField.val(sequence.scale||"1")
  fcField.val(sequence.fc||"FC3")
  addressField.val(sequence.address||"")

  function update(){
   refreshRow(row)
  }

  fcField.change(update)
  datatypeField.change(update)

 }

})

row.data("fila",fila)

refreshRow(row)

},

removable:true,
sortable:true

})

if(!this.sequences) this.sequences=[]

for(let i=0;i<this.sequences.length;i++){
 $("#node-input-sequences-container").editableList('addItem',this.sequences[i])
}

},

oneditsave:function(){

let sequences=$("#node-input-sequences-container").editableList('items')

let node=this

// CA5: un uuid v4 válido en mayúsculas o con espacios se guarda recortado y en
// minúsculas. normalizarUuid() no inventa nada si no es válido: eso lo dice
// `validate` (RN1, CA4).
$("#node-input-device_uuid").val(reglas.normalizarUuid($("#node-input-device_uuid").val()))

node.sequences=[]

sequences.each(function(){

let seq=$(this)

let datatype=seq.find(".node-input-datatype").val()

let quantity=1

if(["int32","uint32","float32"].includes(datatype)) quantity=2
if(["int64","uint64","float64"].includes(datatype)) quantity=4

// Nombre, uuid, unidad, uso, lectura del conteo y umbrales los lee el
// componente común; la lectura Modbus, este nodo. El uso decide nature y role:
// no se guardan (ni type, ni la prioridad de los umbrales).
// editableList('items') devuelve el contenido de cada fila; si alguna versión de
// Node-RED devolviera el <li>, el contenido está dentro.
let filaComun=seq.data("fila") || seq.find(".red-ui-editableList-item-content").data("fila")

let modelo=filaComun.leer()

node.sequences.push(reglas.guardarVariable(Object.assign({},modelo,{

 datatype:datatype,
 byteorder:seq.find(".node-input-byteorder").val(),
 wordorder:seq.find(".node-input-wordorder").val(),
 scale:seq.find(".node-input-scale").val(),
 fc:seq.find(".node-input-function").val(),
 address:seq.find(".node-input-address").val(),
 quantity:quantity

})))

})

// Node-RED no permite cancelar el guardado, así que la configuración inválida
// se dice aquí y el nodo queda marcado en rojo por `validate`.
let motivos=[]

let deviceUuid=$("#node-input-device_uuid").val()

// itemsDeIdentidad()/nombresDeDispositivoCompartido() leen node.device_uuid y
// node.device_name: se fijan aquí explícitamente porque Node-RED solo copia
// los campos ligados al formulario DESPUÉS de que oneditsave termina.
node.device_uuid=deviceUuid
node.device_name=$("#node-input-device_name").val()

if(!reglas.esUuidV4(deviceUuid)){
 motivos.push(node._("modbus-variable.notify.deviceUuid"))
}

node.sequences.forEach(function(s){

 let nombre=s.name||node._("modbus-variable.notify.unnamed")

 if(!s.name){
  motivos.push(nombre+": "+node._("modbus-variable.notify.noName"))
 }

 reglas.validarVariable(s).forEach(function(e){
  motivos.push(nombre+": "+e)
 })

 // Un contador de producción sin su umbral de conteo cero: el uso es válido,
 // pero la variable no sirve para lo que se declaró.
 reglas.avisosDeConfiguracion(s).forEach(function(e){
  motivos.push(nombre+": "+e)
 })

 if(!reglas.esUuidV4(s.variable_uuid)){
  motivos.push(nombre+": "+node._("modbus-variable.notify.variableUuid"))
 }

})

// RN4: variable_uuid único dentro del device_uuid, sumando este nodo y los
// demás del espacio de trabajo que lo comparten.
let duplicados=reglas.duplicadosPorDispositivo(itemsDeIdentidad(node))

duplicados.forEach(function(d){
 motivos.push(node._("modbus-variable.notify.duplicate",{
  variable:d.variable_uuid,
  device:d.device_uuid,
  names:d.items.map(function(it){ return it.name||node._("modbus-variable.notify.unnamed") }).join(", ")
 }))
})

if(motivos.length){
 RED.notify(
  node._("modbus-variable.notify.invalid")+"<br>"+motivos.join("<br>"),
  {type:"error",timeout:10000}
 )
}

// E5/CA6: aviso, sin invalidar (E6: dos nodos del mismo equipo comparten
// device_uuid a propósito).
let compartidos=nombresDeDispositivoCompartido(node)

if(compartidos.length){
 RED.notify(
  node._("modbus-variable.notify.sharedDevice")+" "
   +compartidos.map(function(c){ return c.device_name.join(" / ") }).join(", "),
  {type:"warning",timeout:10000}
 )
}

}

})

</script>


<script type="text/x-red" data-template-name="modbus-variable">

<div class="form-row">
<label data-i18n="node-red:common.label.name"></label>
<input type="text" id="node-input-name">
</div>

<div class="form-row">
<label>Device UUID</label>
<input type="text" id="node-input-device_uuid" style="width:60%">
<button type="button" id="btn-generar-device-uuid" class="red-ui-button" style="margin-left:6px" data-i18n="modbus-variable.label.generate"></button>
</div>

<div class="form-row">
<label>Device Name</label>
<input type="text" id="node-input-device_name">
</div>

<div class="form-row">
<label>Unit ID</label>
<input type="text" id="node-input-unitid">
</div>

<div class="form-row">
<label data-i18n="modbus-variable.label.period"></label>
<input type="text" id="node-input-period_ms" placeholder="1000">
</div>

<div class="form-row">
<label data-i18n="modbus-variable.label.failedCycles" style="width:auto"></label>
<input type="number" id="node-input-failed_cycles" min="1" step="1" placeholder="3" style="width:70px">
</div>

<div class="form-row">
<label data-i18n="modbus-variable.label.server"></label>
<input type="text" id="node-input-server">
</div>

<div class="form-row">
<button type="button" id="btn-generar-faltantes" class="red-ui-button" data-i18n="modbus-variable.label.generateMissing"></button>
</div>

<div class="form-row">
<ol id="node-input-sequences-container"></ol>
</div>

</script>
