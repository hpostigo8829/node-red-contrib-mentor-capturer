<script type="text/html" data-template-name="number-to-modbus-registers">

    <div class="form-row">
        <label for="node-input-name">
            <i class="fa fa-tag"></i> <span data-i18n="node-red:common.label.name"></span>
        </label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]node-red:common.label.name">
    </div>

    <div class="form-row">
        <label for="node-input-tipo">
            <i class="fa fa-cogs"></i> <span data-i18n="number-to-modbus-registers.label.dataType"></span>
        </label>
        <select id="node-input-tipo">
            <option value="INT16">INT16</option>
            <option value="UINT16">UINT16 / WORD</option>
            <option value="INT32">INT32</option>
            <option value="UINT32">UINT32 / DWORD</option>
            <option value="FLOAT32">FLOAT32</option>
            <option value="INT64">INT64</option>
            <option value="UINT64">UINT64</option>
            <option value="FLOAT64">FLOAT64 / DOUBLE</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-byteOrder">
            <i class="fa fa-exchange"></i> <span data-i18n="number-to-modbus-registers.label.byteOrder"></span>
        </label>
        <select id="node-input-byteOrder">
            <option value="BE" data-i18n="number-to-modbus-registers.label.bigEndian"></option>
            <option value="LE" data-i18n="number-to-modbus-registers.label.littleEndian"></option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-wordOrder">
            <i class="fa fa-random"></i> <span data-i18n="number-to-modbus-registers.label.wordOrder"></span>
        </label>
        <select id="node-input-wordOrder">
            <option value="normal" data-i18n="number-to-modbus-registers.label.normal"></option>
            <option value="swap" data-i18n="number-to-modbus-registers.label.swap"></option>
        </select>
    </div>

</script>

<script type="text/javascript">
RED.nodes.registerType('number-to-modbus-registers',{
    category: 'mentor-capturer',
    color: '#E9967A',
    defaults: {
        name: {value:""},
        tipo: {value:"INT16"},
        byteOrder: {value:"BE"},
        wordOrder: {value:"normal"}
    },
    inputs: 1,
    outputs: 1,
    icon: "modbus.png",
    paletteLabel: function() {
        return this._("number-to-modbus-registers.palette");
    },
    label: function() {
        return this.name || this._("number-to-modbus-registers.palette");
    }
});
</script>
