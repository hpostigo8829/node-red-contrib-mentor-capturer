<script type="text/html" data-template-name="number-to-modbus-registers">

    <div class="form-row">
        <label for="node-input-name">
            <i class="fa fa-tag"></i> Name
        </label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>

    <div class="form-row">
        <label for="node-input-tipo">
            <i class="fa fa-cogs"></i> Data Type
        </label>
        <select id="node-input-tipo">
            <option value="INT16">INT16</option>
            <option value="UINT16">UINT16 / WORD</option>
            <option value="INT32">INT32</option>
            <option value="UINT32">UINT32 / DWORD</option>
            <option value="FLOAT32">FLOAT32</option>
            <option value="INT64">INT64</option>
            <option value="UINT64">UINT64</option>
            <option value="FLOAT64">FLOAT64 / DOUBLE</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-byteOrder">
            <i class="fa fa-exchange"></i> Byte Order
        </label>
        <select id="node-input-byteOrder">
            <option value="BE">Big Endian</option>
            <option value="LE">Little Endian</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-wordOrder">
            <i class="fa fa-random"></i> Word Order
        </label>
        <select id="node-input-wordOrder">
            <option value="normal">Normal</option>
            <option value="swap">Swap</option>
        </select>
    </div>

</script>

<script type="text/javascript">
RED.nodes.registerType('number-to-modbus-registers',{
    category: 'mentor-capturer',

        name: {value:""},

        byteOrder: {value:"BE"},
        wordOrder: {value:"normal"}
    },
    inputs: 1,

    icon: "modbus.png",
    paletteLabel: "Number To Modbus Registers",

        return this.name || "Number To Modbus Registers";
    }
});
</script>

<script type="text/html" data-help-name="number-to-modbus-registers">

<p>Converts a number into an array of Modbus registers (16-bit), based on the configured data type,
byte order, and word order — the reverse operation of <code>modbus-registers-to-number</code>.</p>

<h3>Configuration</h3>
<dl class="message-properties">
    <dt>Data Type</dt>
    <dd>Input numeric type (<code>INT16</code>, <code>UINT16</code>, <code>INT32</code>, <code>UINT32</code>, <code>FLOAT32</code>, <code>INT64</code>, <code>UINT64</code>, <code>FLOAT64</code>).</dd>
    <dt>Byte Order</dt>
    <dd>Byte order within the value (Big Endian / Little Endian).</dd>
    <dt>Word Order</dt>
    <dd>Order of the registers when the value spans more than one (Normal / Swap).</dd>
</dl>

<h3>Input</h3>
<p><code>msg.payload</code> must be a number (or a numeric-convertible value) to encode.</p>

<h3>Output</h3>
<p><code>msg.payload</code> is replaced with the resulting array of 16-bit registers. <code>msg.tipo</code>,
<code>msg.byteOrder</code>, and <code>msg.wordOrder</code> are also added with the configuration used.</p>

</script>
