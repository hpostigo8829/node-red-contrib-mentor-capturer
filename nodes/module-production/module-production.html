<script type="text/javascript" src="resources/node-red-contrib-mentor-capturer/naturaleza-variable.js"></script>
<script type="text/javascript" src="resources/node-red-contrib-mentor-capturer/fila-variable.js"></script>

<script type="text/javascript">

var reglas = MentorNaturalezaVariable;

// Un sensor de conteo es válido con nombre, uso de conteo y los umbrales bien
// escritos, y —si su uso es «Conteo de producción»— con su umbral de conteo cero.
function sensorDeConteoValido(nodo, sensor) {

    if (typeof MentorNaturalezaVariable === "undefined") return true;

    const variable = MentorNaturalezaVariable.variableDeSensor(nodo, sensor);

    return !!variable.name
        && MentorNaturalezaVariable.validarSensorDeConteo(variable).length === 0
        && MentorNaturalezaVariable.avisosDeConfiguracion(variable).length === 0;
}

RED.nodes.registerType('module-production', {
    category: 'mentor-capturer',
    color: '#87CEFA',
    defaults: {
        name: { value: "" },

        device_uuid: {
            value: "",
            required: true,
            validate: function (v) {
                if (typeof MentorNaturalezaVariable === "undefined") return true;
                return MentorNaturalezaVariable.esUuidV4(MentorNaturalezaVariable.normalizarUuid(v));
            }
        },
        device_name: { value: "", required: true },

        // Intervalo de muestra (spec 010, D13): segundos entre muestras, un divisor
        // de 60. Un flujo sin el campo queda en 1 s.
        sample_interval: {
            value: 1,
            validate: function (v) {
                if (v === "" || v === undefined || v === null) return true;
                if (typeof MentorNaturalezaVariable === "undefined") return true;
                return MentorNaturalezaVariable.INTERVALOS_DE_MUESTRA.indexOf(Number(v)) !== -1;
            }
        },

        sc1_topic: { value: "gpio/4" },
        sc2_topic: { value: "" },
        sp_topic:  { value: "" },

        // Cada sensor es una variable: nombre, uuid, unidad, uso y umbrales
        // propios (spec 009). La presencia es solo un estado: sin unidad ni
        // umbrales.
        sc1_name: { value: "SENSOR DE CONTEO 1" },
        sc1_unit: { value: "und" },
        sc1_usage: {
            value: "",
            validate: function () {
                return sensorDeConteoValido(this, "sc1");
            }
        },
        sc1_thresholds: { value: [] },

        sc2_name: { value: "SENSOR DE CONTEO 2" },
        sc2_unit: { value: "und" },
        sc2_usage: {
            value: "",
            validate: function () {
                if (!this.sc2_topic) return true;
                return sensorDeConteoValido(this, "sc2");
            }
        },
        sc2_thresholds: { value: [] },

        sp_name: { value: "SENSOR DE PRESENCIA" },

        // Identificadores por sensor (spec 007): obligatorio solo si el
        // sensor está activado (CA2). SC1 siempre lo está.
        uuid_sc1: {
            value: "",
            validate: function (v) {
                if (typeof MentorNaturalezaVariable === "undefined") return true;
                return MentorNaturalezaVariable.esUuidV4(MentorNaturalezaVariable.normalizarUuid(v));
            }
        },
        uuid_sc2: {
            value: "",
            validate: function (v) {
                if (typeof MentorNaturalezaVariable === "undefined") return true;
                if (!this.sc2_topic) return true;
                return MentorNaturalezaVariable.esUuidV4(MentorNaturalezaVariable.normalizarUuid(v));
            }
        },
        uuid_sp: {
            value: "",
            validate: function (v) {
                if (typeof MentorNaturalezaVariable === "undefined") return true;
                if (!this.sp_topic) return true;
                return MentorNaturalezaVariable.esUuidV4(MentorNaturalezaVariable.normalizarUuid(v));
            }
        },

        th_sc1_desalineado: { value: 6 },
        th_sp_desconectado: { value: 6 },
        th_sc1_blocked_sec: { value: 3 },
        th_sp_desalineado: { value: 10 },
        th_sc1_blocked_min: { value: 10 },
        th_sc2_blocked_min: { value: 10 },

        enable_alarm1: { value: false },
        enable_alarm2: { value: false },
        enable_alarm3: { value: true },
        enable_alarm4: { value: false },
        enable_alarm5: { value: true },
        enable_alarm6: { value: false },

        enable_debug: { value: false },

        // Heredados de antes del uso de la variable (papel por sensor y lista de
        // umbrales común). Se declaran para que el editor pueda leer un flujo
        // antiguo y deducir de ahí el uso; al guardar quedan vacíos.
        sc1_role: { value: "" },
        sc2_role: { value: "" },
        thresholds: { value: [] }
    },

    inputs: 1,
    outputs: 3,
    icon: "setup.png",
    paletteLabel: function () {
        return this._("module-production.palette");
    },

    label: function () {
        return this.name || this._("module-production.palette");
    },

    oneditprepare: function () {

        const node = this;

        $("#btn-generar-device-uuid").on("click", function (e) {
            e.preventDefault();
            $("#node-input-device_uuid").val(reglas.nuevoUuidV4());
        });

        const IO_MAP = {
            "IN01": "gpio/4",
            "IN02": "gpio/17",
            "IN03": "gpio/27",
            "IN04": "gpio/22",
            "IN05": "gpio/5",
            "IN06": "gpio/6",
            "IN07": "gpio/13",
            "IN08": "gpio/19",
            "IN09": "gpio/26"
        };

        function fillSelect(id, currentValue, allowNone = false) {

            const select = $("#" + id);

            select.empty();

            if (allowNone) {
                select.append(
                    $('<option></option>')
                        .val("")
                        .text(node._("module-production.label.none"))
                );
            }

            Object.keys(IO_MAP).forEach(key => {

                const val = IO_MAP[key];

                const opt = $('<option></option>')
                    .val(val)
                    .text(key);

                if (val === currentValue) {
                    opt.attr("selected", "selected");
                }

                select.append(opt);
            });
        }

        function updateLabel(selectId, labelId) {

            const val = $("#" + selectId).val();

            $("#" + labelId).text(val || node._("module-production.label.none"));
        }

        fillSelect("node-input-sc1_topic", this.sc1_topic, false);
        fillSelect("node-input-sc2_topic", this.sc2_topic, true);
        fillSelect("node-input-sp_topic", this.sp_topic, true);

        // Un sensor sin entrada elegida no se configura: su bloque se oculta.
        function alCambiarEntrada(selectId, labelId, bloqueId) {
            updateLabel(selectId, labelId);
            $("#" + bloqueId).toggle(!!$("#" + selectId).val());
        }

        [
            ["node-input-sc1_topic", "label-sc1", "bloque-sc1"],
            ["node-input-sc2_topic", "label-sc2", "bloque-sc2"],
            ["node-input-sp_topic", "label-sp", "bloque-sp"]
        ].forEach(function (p) {
            $("#" + p[0]).on("change", function () { alCambiarEntrada(p[0], p[1], p[2]); });
            alCambiarEntrada(p[0], p[1], p[2]);
        });

        // =========================
        // VARIABLES DE LOS SENSORES
        // =========================
        // variableDeSensor() lee lo guardado, también por versiones anteriores
        // (papel y umbrales comunes), y deduce el uso.
        const soloConteo = function (uso) { return uso.nature === "increment"; };

        // Los textos del formulario común salen del catálogo de este nodo (clave
        // fila.*), en el idioma del editor.
        const t = function (clave, variables) { return node._("module-production.fila." + clave, variables); };

        // El intervalo de muestra es un número: el editor lo guarda tal cual.
        $("#node-input-sample_interval").val(String(node.sample_interval || 1));

        // Los formularios se guardan en su propio bloque, no en el nodo.
        $("#variable-sc1").data("fila", MentorFilaVariable.crear($("#variable-sc1"), reglas.variableDeSensor(node, "sc1"), { usos: soloConteo, t: t }));
        $("#variable-sc2").data("fila", MentorFilaVariable.crear($("#variable-sc2"), reglas.variableDeSensor(node, "sc2"), { usos: soloConteo, t: t }));
        $("#variable-sp").data("fila", MentorFilaVariable.crear($("#variable-sp"), reglas.variableDeSensor(node, "sp"), {
            usoFijo: "state",
            conUnidad: false,
            conUmbrales: false,
            t: t
        }));
    },

    oneditsave: function () {

        const node = this;

        // El uso decide nature y role: no se guardan. Se guardan el nombre, el uuid
        // (recortado y en minúsculas si es válido: CA5 de la spec 007), la unidad, el
        // uso y los umbrales de cada sensor, con el mismo formato que modbus-variable.
        ["sc1", "sc2"].forEach(function (sensor) {
            const fila = $("#variable-" + sensor).data("fila");
            Object.assign(node, reglas.camposDeSensor(sensor, reglas.guardarVariable(fila.leer())));
        });

        const filaSp = $("#variable-sp").data("fila");
        Object.assign(node, reglas.camposDeSensor("sp", filaSp.leer()));

        Object.assign(node, {
            sc1_role: "",
            sc2_role: "",
            thresholds: []
        });

        // Intervalo de muestra: número, no texto del desplegable.
        node.sample_interval = Number($("#node-input-sample_interval").val()) || 1;

        $("#node-input-device_uuid").val(reglas.normalizarUuid($("#node-input-device_uuid").val()));
    }
});
</script>
